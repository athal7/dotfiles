# Package registry — single source of truth for all managed dependencies.
# brew, cask, mise, and GitHub release packages. Install scripts and
# chezmoi externals are generated from this file.

packages:
  taps:
    - athal7/tap
    - github/gh
    - jnsahaj/lumen
    - steipete/tap
    - can1357/tap
    - mozilla-ai/tap

  brews:
    - name: can1357/tap/omp
    - name: aoe
    - name: autojump
    - name: bat
    - name: chezmoi
      permissions:
        - match: "chezmoi destroy*"
          approval: ask
        - match: "chezmoi upgrade*"
          approval: ask
        - match: "chezmoi forget*"
          approval: ask
        - match: "chezmoi-deploy*"
          approval: ask
        - match: "chezmoi apply*"
          approval: ask
        - match: "chezmoi purge*"
          approval: ask
        - match: "chezmoi init*"
          approval: ask
        - match: "chezmoi add*"
          approval: ask
    - name: container
    - name: direnv
    - name: ffmpeg
    - name: fzf
    - name: git
      permissions:
        - match: "git -C * reset --hard*"
          approval: ask
        - match: "git worktree remove*"
          approval: ask
        - match: "git reset --merge*"
          approval: ask
        - match: "git checkout * -- *"
          approval: ask
        - match: "git checkout -- *"
          approval: ask
        - match: "git reset --hard*"
          approval: ask
        - match: "git -C * clean -f*"
          approval: ask
        - match: "git stash clear*"
          approval: ask
        - match: "git stash drop*"
          approval: ask
        - match: "git -C * commit*"
          approval: ask
        - match: "git branch -D*"
          approval: ask
        - match: "git branch -d*"
          approval: ask
        - match: "git clean -d*"
          approval: ask
        - match: "git clean -f*"
          approval: ask
        - match: "git restore *"
          approval: ask
        - match: "git -C * push*"
          approval: ask
        - match: "git commit*"
          approval: ask
        - match: "git push*"
          approval: ask
    - name: gh
      permissions:
        - match: "gh* search *"
          approval: allow
        - match: "gh* list*"
          approval: allow
        - match: "gh* view*"
          approval: allow
        - match: "gh* status*"
          approval: allow
        - match: "gh api *"
          approval: ask
        - match: "gh *"
          approval: ask
    - name: athal7/tap/attention
    - name: athal7/tap/git-worktree-sync
    - name: athal7/tap/launchd-yaml
    - name: athal7/tap/kb
    - name: git-spice
    - name: jc
    - name: jq
    - name: k9s
    - name: kubernetes-cli
    - name: jnsahaj/lumen/lumen
    - name: macos-trash
    - name: mas
    - name: mise
    - name: neovim
    - name: openspec
    - name: openssl
    - name: opentofu
    - name: ripgrep
    - name: starship
    - name: talisman
    - name: watch
    - name: worktrunk
    - name: xh
      permissions:
        - match: "xh-es-search '*'"
          approval: allow
        - match: "xh *mutation*"
          approval: ask
        - match: "xh *DELETE *"
          approval: ask
        - match: "xh *PATCH *"
          approval: ask
        - match: "xh *HEAD *"
          approval: allow
        - match: "xh *POST *"
          approval: ask
        - match: "xh *query*"
          approval: allow
        - match: "xh *GET *"
          approval: allow
        - match: "xh *PUT *"
          approval: ask
        - match: "xh *"
          approval: ask
    - name: yq
    - name: steipete/tap/remindctl
      permissions:
        - match: "remindctl status*"
          approval: allow
        - match: "remindctl list*"
          approval: allow
        - match: "remindctl show*"
          approval: allow
        - match: "remindctl *"
          approval: ask
    - name: typescript-language-server
    - name: pyright
    - name: gopls
    - name: terraform-ls
    - name: lua-language-server
    - name: bash-language-server
    - name: yaml-language-server
    - name: witr

  # aoe (Agent of Empires) plugins — installed/updated via
  # run_onchange_after_plugins-aoe.sh.tmpl. A list from day one (even with a
  # single entry) so adding another aoe plugin later is a one-line registry
  # edit, matching the idiom of every other registry key here.
  aoe_plugins:
    - source: "gh:agent-of-empires/plugin-github"
      id: "agent-of-empires.github"
    - source: "gh:agent-of-empires/plugin-cron"
      id: "agent-of-empires.cron"

  pi_packages: []

  casks:
    - name: mozilla-ai/tap/cq
    - name: gcloud-cli
    - name: font-monaspace-nf
    - name: tailscale-app
    - name: obsidian
    - name: figma

  # GitHub releases — installed via .chezmoiexternal.toml.tmpl
  github_releases:
    # Note: com.apple.provenance on Apple Silicon prevents chezmoi's atomic
    # rename from updating files inside this bundle. On version updates, run:
    #   rm -rf ~/Applications/NayaFlow-Beta.app && chezmoi apply
    - name: naya-flow-beta
      repo: NayaTech/NayaFlow-beta-releases
      target: Applications
      app: NayaFlow-Beta.app
      asset: NayaFlow-Beta-*-arm64-mac.zip
      type: archive
      refresh_period: 24h

    - name: ical
      repo: BRO3886/ical
      target: .local/bin/ical
      asset: ical-darwin-arm64.tar.gz
      type: archive-file
      path: ical
      executable: true
      refresh_period: 24h

  # Non-authored skills synced into the global skill dir.
  skills:
    - repo: BRO3886/ical
      skill: ical-cli

  # npm-managed global packages
  npm:
    homebridge_version: "1.11.4"
    ui_version: "5.21.0"
    nest_sdm_version: "1.1.23"
    ffmpeg_for_homebridge_version: "2.2.2"

  # mise-managed runtimes and tools
  mise:
    - name: ruby
      version: "3.4"
    - name: node
      version: lts
    - name: bun
      version: latest
    - name: python
      version: "3"
    - name: rust
      version: stable
    - name: ruff
      version: latest
    - name: uv
      version: latest
    - name: pre-commit
      version: latest
    - name: terraform
      version: latest
    - name: helm
      version: latest
    - name: argocd
      version: latest
    - name: npm:@oh-my-pi/pi-coding-agent
      version: latest
    - name: npm:@google/jules
      version: latest
    - name: npm:freebuff
      version: latest
    - name: pipx:pytest
      version: latest
    - name: pipx:check-jsonschema
      version: latest
    - name: pipx:grip
      version: latest
    - name: pipx:skills-ref
      version: latest
    - name: pipx:mlx-lm
      version: latest
    - name: pipx:mlx-optiq
      version: latest
