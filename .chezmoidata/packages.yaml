# Package registry — single source of truth for managed dependencies.
# Homebrew, mise, GitHub releases, and pinned source files.
# Install scripts and chezmoi externals are generated from this file.

packages:
  taps:
    - athal7/tap
    - github/gh
    - jnsahaj/lumen
    - steipete/tap
    - kunobi-ninja/kunobi
    - saffsanity/sill

  brews:
    - name: aoe
    - name: autojump
    - name: bat
    - name: chezmoi
    # Colima supplies the Docker runtime; preserve any existing Apple container
    # installation and its data until a separately verified migration.
    - name: colima
    - name: direnv
    - name: docker
    - name: docker-compose
    - name: ffmpeg
    - name: fzf
    - name: git
    - name: gh
    - name: athal7/tap/attention
    - name: athal7/tap/cal-automation
    - name: athal7/tap/git-worktree-sync
    - name: athal7/tap/launchd-yaml
    - name: athal7/tap/kb
    - name: git-spice
    - name: jc
    - name: jq
    - name: k9s
    - name: kunobi-ninja/kunobi/kache
    - name: kubernetes-cli
    - name: jnsahaj/lumen/lumen
    - name: macos-trash
    - name: mas
    - name: mise
    - name: neovim
    - name: openssl
    - name: opentofu
    - name: ripgrep
    - name: starship
    - name: talisman
    - name: watch
    - name: worktrunk
    - name: xh
    - name: yq
    - name: steipete/tap/remindctl
    - name: typescript-language-server
    - name: pyright
    - name: gopls
    - name: tofu-ls
    - name: lua-language-server
    - name: bash-language-server
    - name: yaml-language-server
    - name: witr

  # OMP plugins installed by run_onchange_after_plugins-omp.sh.tmpl.
  omp_plugins:
    - "@mozilla-ai/pi-otari"

  # AoE plugins: these sources are trusted for unattended install and updates,
  # including future capabilities, build steps, UI and agent integrations.
  # Grants remain AoE-owned local receipts; unknown local plugins are excluded.
  aoe_plugins:
    # Reserved-namespace plugin: aoe refuses an @ref install here (unverified
    # code cannot claim agent-of-empires.*), so this tracks the latest release.
    # v2.4.0 ships the one-character row-badge marks (dense_row_badge_glyphs).
    - source: "gh:agent-of-empires/plugin-github"
      id: "agent-of-empires.github"
    # The three sources below are pinned because upstream renamed their manifest
    # ids into the `agent-of-empires.*` namespace on 2026-11-10. aoe only lets a
    # featured-verified plugin claim that namespace, and the featured index in
    # aoe 1.22.3 pins nothing beyond github, cron and kanban, so installing the
    # renamed manifests is refused outright. Each ref below is the last revision
    # that still declares a community id this host accepts; move back to a branch
    # or release once an aoe release features these plugins.
    #
    # Linear has no published releases upstream, so a bare slug cannot resolve an
    # update; 16dbb7f is the commit before the rename.
    - source: "gh:agent-of-empires/plugin-linear@16dbb7f"
      id: "community.linear"
    # 8c3e053 is the commit before the rename. Its manifest ships api_version 19
    # with the freebuff agent integration, which the host reads from
    # aoe-plugin.toml.
    - source: "gh:agent-of-empires/plugin-freebuf@8c3e053"
      id: "dev.example.aoe-freebuf"
    # Paired OMP integration: its manifest gates which OMP releases may reply
    # through AoE, so a stale copy silently disables the approval dialog.
    # be12ece is the last revision this host can load: everything newer declares
    # api_version 20 with `agent_integrations` fields (resume_arg, detection) and
    # `resume_arg` alone already fails manifest parsing on aoe 1.22.3, including
    # the v0.4.0 tag, which was re-cut after the fact. Pair it with the extension
    # pinned in github_files below.
    - source: "gh:agent-of-empires/plugin-omp@be12ece"
      id: "omp.agent-of-empires"

  casks:
    - name: firefox
    - name: ghostty
    - name: gcloud-cli
    - name: font-monaspace-nf
    - name: tailscale-app
    - name: obsidian
    - name: figma
    # Pair devices and grant macOS permissions in Sill after installation.
    - name: saffsanity/sill/sill

  # GitHub releases — installed via .chezmoiexternal.toml.tmpl
  github_releases:
    - name: openflow
      repo: create-collective/openflow
      target: Applications/OpenFlow-0.7.1.dmg
      tag: openflow-v0.7.1
      asset: OpenFlow-0.7.1-mac-arm64.dmg
      checksum: 2e14c83dc195f4271ebb19f367d23fb3f2de74007f612dbc7a3595b873b5dfd6
      type: file

    - name: create-companion
      repo: create-collective/create-companion
      target: Applications
      app: Create Companion.app
      tag: v1.0.0
      asset: Create.Companion_1.0.0_universal.app.tar.gz
      checksum: 1bab285db7605bdcdffe71b6371b1ef1a87c7cee53d5ae2d94fdf17ea109b41b
      type: archive

    - name: ical
      repo: BRO3886/ical
      target: .local/bin/ical
      asset: ical-darwin-arm64.tar.gz
      type: archive-file
      path: ical
      executable: true
      refresh_period: 24h

    # Pinned rather than tracked: the AoE OMP plugin allowlists provider
    # versions up to 18.16.0, and above that the plugin drops its approval
    # reply bridge. The Homebrew tap formula always floats to the newest
    # release, so OMP installs here as a verified release instead. Move the tag
    # forward once the plugin's allowlist covers a newer version.
    - name: omp
      repo: can1357/oh-my-pi
      target: .local/bin/omp
      tag: v18.16.0
      asset: omp-darwin-arm64
      checksum: d4a10d97488d6054d2b18198bd24f461079952c7e0fb75ba66336ca0df0cb99e
      type: file
      executable: true

  # GitHub source files are installed through .chezmoiexternal.toml.tmpl.
  github_files:
    - name: aoe-omp-extension
      repo: agent-of-empires/plugin-omp
      # No releases or tags upstream, so track the branch the paired AoE plugin
      # installs from. No checksum: it would fail the apply on every upstream
      # commit, so integrity now rests on the repo rather than a pinned digest.
      ref: main
      path: omp-extension/index.ts
      target: .local/share/omp/extensions/agent-of-empires.ts



  # Non-authored skills synced into the global skill dir.
  skills:
    - repo: BRO3886/ical
      skill: ical-cli

  # npm-managed global packages — unpinned, so each install takes the current
  # published release.
  npm:
    homebridge_version: "latest"
    ui_version: "latest"
    nest_sdm_version: "latest"
    ffmpeg_for_homebridge_version: "latest"

  # mise-managed runtimes and tools
  mise:
    - name: ruby
      version: "3.4"
      # ruby-lsp must exist under whichever Ruby a project selects via
      # .ruby-version, so install it into every Ruby rather than once with gem:.
      postinstall: "gem install ruby-lsp"
    - name: node
      version: lts
    - name: bun
      version: latest
    - name: python
      version: "3"
    - name: rust
      version: stable
    - name: ruff
      version: latest
    - name: uv
      version: latest
    - name: pre-commit
      version: latest
    - name: helm
      version: latest
    - name: argocd
      version: latest
    - name: spacectl
      version: latest
    - name: fnox
      version: latest
    - name: npm:freebuff
      version: latest
      # The vendor publishes from a GitHub Actions OIDC trusted publisher but
      # sets `publishConfig.provenance: false`, so the 0.2 line carries publisher
      # metadata without Sigstore attestations. aube reads that as a downgrade
      # from the signed 0.0.11 and refuses. Reviewed 2026-11-05: maintainers,
      # repo (CodebuffAI/freebuff) and tarball integrity are unchanged from the
      # signed releases. The exemption is scoped to this minor line so a new
      # major re-opens the review instead of silently inheriting trust.
      trust_policy_excludes: ["freebuff@^0.2.36"]
    - name: npm:codebase-memory-mcp
      version: latest
      allow_builds: [codebase-memory-mcp]
    - name: npm:@mozilla/firefox-devtools-mcp
      version: latest
    - name: pipx:pytest
      version: latest
    - name: pipx:check-jsonschema
      version: latest
    - name: pipx:grip
      version: latest
    - name: pipx:skills-ref
      version: latest
