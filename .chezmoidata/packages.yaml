# Package registry — single source of truth for managed dependencies.
# Homebrew, mise, GitHub releases, and pinned source files.
# Install scripts and chezmoi externals are generated from this file.

packages:
  taps:
    - athal7/tap
    - athal7/versions
    - github/gh
    - jnsahaj/lumen
    - steipete/tap
    - can1357/tap

  brews:
    - name: athal7/versions/omp@18.10.4
    - name: aoe
    - name: autojump
    - name: bat
    - name: chezmoi
    - name: colima
    - name: container
    - name: direnv
    - name: docker
    - name: docker-compose
    - name: ffmpeg
    - name: fzf
    - name: git
    - name: gh
    - name: athal7/tap/attention
    - name: athal7/tap/cal-automation
    - name: athal7/tap/git-worktree-sync
    - name: athal7/tap/launchd-yaml
    - name: athal7/tap/kb
    - name: git-spice
    - name: jc
    - name: jq
    - name: k9s
    - name: kubernetes-cli
    - name: jnsahaj/lumen/lumen
    - name: macos-trash
    - name: mas
    - name: mise
    - name: neovim
    - name: openssl
    - name: opentofu
    - name: ripgrep
    - name: starship
    - name: talisman
    - name: watch
    - name: worktrunk
    - name: xh
    - name: yq
    - name: steipete/tap/remindctl
    - name: typescript-language-server
    - name: pyright
    - name: gopls
    - name: tofu-ls
    - name: lua-language-server
    - name: bash-language-server
    - name: yaml-language-server
    - name: witr

  # aoe (Agent of Empires) plugins — installed/updated via
  # run_onchange_after_plugins-aoe.sh.tmpl. Keep sources and IDs here;
  # managed enablement and grants live in config.toml.tmpl.
  aoe_plugins:
    - source: "gh:agent-of-empires/plugin-github"
      id: "agent-of-empires.github"
    - source: "gh:athal7/attention"
      id: "athal7.attention"

  casks:
    - name: firefox
    - name: ghostty
    - name: gcloud-cli
    - name: font-monaspace-nf
    - name: tailscale-app
    - name: obsidian
    - name: figma

  # GitHub releases — installed via .chezmoiexternal.toml.tmpl
  github_releases:
    - name: openflow
      repo: create-collective/openflow
      target: Applications/OpenFlow-0.7.0.dmg
      tag: openflow-v0.7.0
      asset: OpenFlow-0.7.0-mac-arm64.dmg
      checksum: a022e08c6b7983f6ee33f6997bebb44c1b32697e3762bd5e34bc73f16458dfb9
      type: file

    - name: create-companion
      repo: create-collective/create-companion
      target: Applications
      app: Create Companion.app
      tag: v1.0.0
      asset: Create.Companion_1.0.0_universal.app.tar.gz
      checksum: 1bab285db7605bdcdffe71b6371b1ef1a87c7cee53d5ae2d94fdf17ea109b41b
      type: archive

    - name: ical
      repo: BRO3886/ical
      target: .local/bin/ical
      asset: ical-darwin-arm64.tar.gz
      type: archive-file
      path: ical
      executable: true
      refresh_period: 24h
  # GitHub source files are installed through .chezmoiexternal.toml.tmpl.
  github_files:
    - name: aoe-omp-extension
      repo: athal7/agent-of-empires
      ref: be8e1c439e06878800491839ce328669800d2e12
      path: plugins/agent-omp/omp-extension/index.ts
      target: .local/share/omp/extensions/agent-of-empires.ts
      checksum: bd68e34fea4c8e3da566313ece08e9f3ced7a49e03a7e1d1817181ef6aac5c08



  # Non-authored skills synced into the global skill dir.
  skills:
    - repo: BRO3886/ical
      skill: ical-cli

  # npm-managed global packages
  npm:
    homebridge_version: "1.11.4"
    ui_version: "5.21.0"
    nest_sdm_version: "1.1.23"
    ffmpeg_for_homebridge_version: "2.2.2"

  # mise-managed runtimes and tools
  mise:
    - name: ruby
      version: "3.4"
    - name: node
      version: lts
    - name: bun
      version: latest
    - name: python
      version: "3"
    - name: rust
      version: stable
    - name: ruff
      version: latest
    - name: uv
      version: latest
    - name: pre-commit
      version: latest
    - name: helm
      version: latest
    - name: argocd
      version: latest
    - name: fnox
      version: "1.39.0"
    - name: npm:@google/jules
      version: latest
    - name: npm:freebuff
      version: latest
    - name: npm:codebase-memory-mcp
      version: "0.11.0"
      allow_builds: [codebase-memory-mcp]
    - name: npm:@mozilla/firefox-devtools-mcp
      version: "0.10.5"
    - name: pipx:pytest
      version: latest
    - name: pipx:check-jsonschema
      version: latest
    - name: pipx:grip
      version: latest
    - name: pipx:skills-ref
      version: latest
