# Package registry — single source of truth for managed dependencies.
# Homebrew, upstream install scripts, mise, GitHub releases, and pinned source
# files.
# Install scripts and chezmoi externals are generated from this file.

packages:
  taps:
    - athal7/tap
    - github/gh
    - jnsahaj/lumen
    - steipete/tap
    - kunobi-ninja/kunobi
    - saffsanity/sill
    - chenrui333/tap
    - roeyazroel/linear-tui

  brews:
    - name: autojump
    - name: bat
    - name: chezmoi
    # Colima supplies the Docker runtime; preserve any existing Apple container
    # installation and its data until a separately verified migration.
    - name: colima
    - name: direnv
    - name: docker
    - name: docker-compose
    - name: ffmpeg
    - name: fzf
    - name: git
    - name: gh
    - name: chenrui333/tap/gh-dash
    - name: athal7/tap/attention
    - name: athal7/tap/cal-automation
    - name: athal7/tap/git-worktree-sync
    - name: athal7/tap/launchd-yaml
    - name: athal7/tap/kb
    - name: git-spice
    - name: jc
    - name: jq
    - name: k9s
    - name: kunobi-ninja/kunobi/kache
    - name: kubernetes-cli
    - name: jnsahaj/lumen/lumen
    - name: roeyazroel/linear-tui/linear-tui
    - name: macos-trash
    - name: mas
    - name: mise
    - name: neovim
    - name: openssl
    - name: opentofu
    - name: ripgrep
    - name: starship
    - name: talisman
    # aoe's prerequisite: every AoE session runs in tmux. It used to arrive as
    # a dependency of the aoe formula, which no longer exists, so declare it or
    # `brew autoremove` takes it away again.
    - name: tmux
    - name: watch
    - name: worktrunk
    - name: xh
    - name: yq
    - name: steipete/tap/remindctl
    - name: typescript-language-server
    - name: pyright
    - name: gopls
    - name: tofu-ls
    - name: lua-language-server
    - name: bash-language-server
    - name: yaml-language-server
    - name: witr

  # Tools installed by their own upstream install script rather than Homebrew,
  # because the channel they track has no formula. Each entry runs in
  # run_onchange_after_packages.sh.tmpl, so changing the list re-runs it.
  install_scripts:
    # agent-of-empires publishes nightlies only as GitHub prereleases: there is
    # no nightly Homebrew formula, and `brew install --HEAD` builds main while
    # reporting the stable version, which keeps its update check on stable. The
    # script downloads the platform's prebuilt tarball from the release, so
    # nothing compiles here, and installs the binary to ~/.local/bin. That
    # binary then updates itself with `aoe update`, which follows the nightly
    # channel it came from.
    # A nightly may migrate the app data so an older stable cannot read it until
    # the next stable release; re-run the script without --channel nightly to
    # return to stable.
    - name: aoe
      url: https://raw.githubusercontent.com/agent-of-empires/agent-of-empires/main/scripts/install.sh
      args: ["--channel", "nightly"]

  # OMP plugins installed by run_onchange_after_plugins-omp.sh.tmpl.
  omp_plugins:
    - "@mozilla-ai/pi-otari"

  # AoE plugins, installed only when missing. Updating them is aoe's job: the
  # daemon's updates.auto_update_plugins sweep applies the updates that need no
  # new consent and leaves the rest for `aoe plugin update`. A source with an
  # explicit @ref therefore pins the first install, not an installed copy --
  # changing a pin needs `aoe plugin uninstall <id>` and a re-apply, or aoe keeps
  # the copy it already has. A bare gh:owner/repo source installs at the release
  # the embedded featured index verifies.
  # Grants remain AoE-owned local receipts; unknown local plugins are excluded.
  aoe_plugins:
    # Reserved-namespace plugin: aoe refuses an @ref install here (unverified
    # code cannot claim agent-of-empires.*), so this tracks the latest release.
    # v2.4.0 ships the one-character row-badge marks (dense_row_badge_glyphs).
    - source: "gh:agent-of-empires/plugin-github"
      id: "agent-of-empires.github"
    # Featured as of the aoe 1.24.0 index, so the renamed manifest installs. It
    # replaced the pinned community.linear install; that id is retired in the
    # plugin sync script and its settings carry over in config.toml.tmpl.
    - source: "gh:agent-of-empires/plugin-linear"
      id: "agent-of-empires.linear"
    # Owns the weekday maintenance schedule that was a launchd job. Installing or
    # updating it leaves a stray root-level target/ that perturbs the tree hash
    # aoe checks before letting a plugin claim this namespace, so the plugin is
    # skipped at load until the shared aoe-plugin-tree-fix snippet removes it.
    # config.toml.tmpl holds the job. A worker seeds its schedule on startup and
    # skips occurrences that elapsed while it was down, so a daemon restart at
    # the fire time loses that day rather than the whole schedule.
    - source: "gh:agent-of-empires/plugin-cron"
      id: "agent-of-empires.cron"
    # Featured since the aoe 1.25 index, so the renamed manifest installs and
    # aoe updates it itself. config.toml.tmpl no longer pins freebuff as a
    # custom agent: that pin kept plugin declarations out of the name, which
    # left the plugin unable to own its own tool.
    - source: "gh:agent-of-empires/plugin-freebuf"
      id: "agent-of-empires.aoe-freebuf"
    # Paired OMP integration: its manifest gates which OMP releases may reply
    # through AoE, so a stale copy silently disables the approval dialog.
    # v0.5.0 declares `detection.mode = "native_only"` and api_version 21, so
    # the community-id pin is retired. The extension ships inside this plugin's
    # omp-extension/ directory and is linked into OMP by the sync script, so one
    # installer owns both halves and they cannot drift.
    - source: "gh:agent-of-empires/plugin-omp"
      id: "agent-of-empires.omp"
      omp_extension: "omp-extension"

  # AoE plugin ids upstream renamed. The sync script uninstalls each one so it
  # stops loading beside its replacement, and config.toml.tmpl drops its
  # settings entry instead of preserving it as a local plugin.
  aoe_plugins_retired:
    - id: "community.linear"
      replaced_by: "agent-of-empires.linear"
    - id: "dev.example.aoe-freebuf"
      replaced_by: "agent-of-empires.aoe-freebuf"
    - id: "omp.agent-of-empires"
      replaced_by: "agent-of-empires.omp"

  casks:
    - name: firefox
    - name: ghostty
    - name: gcloud-cli
    - name: font-monaspace-nf
    - name: tailscale-app
    - name: obsidian
    - name: figma
    # Pair devices and grant macOS permissions in Sill after installation.
    - name: saffsanity/sill/sill

  # GitHub releases — installed via .chezmoiexternal.toml.tmpl
  github_releases:
    - name: openflow
      repo: create-collective/openflow
      target: Applications/OpenFlow-0.7.1.dmg
      tag: openflow-v0.7.1
      asset: OpenFlow-0.7.1-mac-arm64.dmg
      checksum: 2e14c83dc195f4271ebb19f367d23fb3f2de74007f612dbc7a3595b873b5dfd6
      type: file

    - name: create-companion
      repo: create-collective/create-companion
      target: Applications
      app: Create Companion.app
      tag: v1.0.0
      asset: Create.Companion_1.0.0_universal.app.tar.gz
      checksum: 1bab285db7605bdcdffe71b6371b1ef1a87c7cee53d5ae2d94fdf17ea109b41b
      type: archive

    - name: ical
      repo: BRO3886/ical
      target: .local/bin/ical
      asset: ical-darwin-arm64.tar.gz
      type: archive-file
      path: ical
      executable: true
      refresh_period: 24h

    # Pinned rather than tracked: the Homebrew tap formula floats to the newest
    # release, so OMP installs here as a verified release instead. AoE's
    # featured OMP plugin release (v0.5.0) allows 18.10.4 up to, but excluding,
    # 19.0.0. Upstream plugin main widened its bound to <20.0.0, but no such
    # release is featured yet, so this tag stays within 18.x until one is.
    - name: omp
      repo: can1357/oh-my-pi
      target: .local/bin/omp
      tag: v18.16.0
      asset: omp-darwin-arm64
      checksum: d4a10d97488d6054d2b18198bd24f461079952c7e0fb75ba66336ca0df0cb99e
      type: file
      executable: true

  # GitHub source files are installed through .chezmoiexternal.toml.tmpl.
  # The OMP extension is not one of them: it ships inside the AoE plugin
  # (agent-of-empires.omp) and is loaded from there by `omp plugin install`, so
  # one installer owns both halves and they cannot drift.
  github_files: []



  # Non-authored skills synced into the global skill dir.
  skills:
    - repo: BRO3886/ical
      skill: ical-cli
    - repo: GoogleChrome/modern-web-guidance
      skill: modern-web-guidance

  # npm-managed global packages — unpinned, so each install takes the current
  # published release.
  npm:
    homebridge_version: "latest"
    ui_version: "latest"
    nest_sdm_version: "latest"
    ffmpeg_for_homebridge_version: "latest"

  # mise-managed runtimes and tools
  mise:
    - name: ruby
      version: "3.4"
      # ruby-lsp must exist under whichever Ruby a project selects via
      # .ruby-version, so install it into every Ruby rather than once with gem:.
      postinstall: "gem install ruby-lsp"
    - name: node
      version: lts
    - name: bun
      version: latest
    - name: python
      version: "3"
    - name: rust
      version: stable
    - name: ruff
      version: latest
    - name: uv
      version: latest
    - name: pre-commit
      version: latest
    - name: helm
      version: latest
    - name: argocd
      version: latest
    - name: spacectl
      version: latest
    - name: fnox
      version: latest
    - name: npm:freebuff
      version: latest
      # The vendor publishes from a GitHub Actions OIDC trusted publisher but
      # sets `publishConfig.provenance: false`, so the 0.2 line carries publisher
      # metadata without Sigstore attestations. aube reads that as a downgrade
      # from the signed 0.0.11 and refuses. Reviewed 2026-11-05: maintainers,
      # repo (CodebuffAI/freebuff) and tarball integrity are unchanged from the
      # signed releases. The exemption is scoped to this minor line so a new
      # major re-opens the review instead of silently inheriting trust.
      trust_policy_excludes: ["freebuff@^0.2.36"]
    - name: npm:codebase-memory-mcp
      version: latest
      allow_builds: [codebase-memory-mcp]
    - name: npm:@mozilla/firefox-mcp
      version: latest
    - name: pipx:pytest
      version: latest
    - name: pipx:check-jsonschema
      version: latest
    - name: pipx:grip
      version: latest
    - name: pipx:skills-ref
      version: latest
