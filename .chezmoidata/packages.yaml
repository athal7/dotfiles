# Package registry — single source of truth for all managed dependencies.
# brew, cask, mise, and GitHub release packages. Install scripts and
# chezmoi externals are generated from this file.
#
# Per-package bash permission rules used to live here too (merged into
# opencode.json at template time); they're now agentcfg-managed — see
# dot_config/agentcfg/bash.yaml's `packages` list, which both harnesses
# compile identically.

packages:
  taps:
    - athal7/tap
    - github/gh
    - jnsahaj/lumen
    - steipete/tap
    - can1357/tap
    - mozilla-ai/tap

  brews:
    - name: can1357/tap/omp
    - name: aoe
    - name: autojump
    - name: bat
    - name: chezmoi
    - name: container
    - name: cq
    - name: direnv
    - name: ffmpeg
    - name: fzf
    - name: git
    - name: gh
    - name: athal7/tap/agentcfg
    - name: athal7/tap/attention
    - name: athal7/tap/git-worktree-sync
    - name: athal7/tap/launchd-yaml
    - name: athal7/tap/kb
    - name: athal7/tap/opencode-pilot
    - name: git-spice
    - name: jc
    - name: jq
    - name: k9s
    - name: kubernetes-cli
    - name: jnsahaj/lumen/lumen
    - name: macos-trash
    - name: mas
    - name: mise
    - name: neovim
    - name: openspec
    - name: openssl
    - name: opentofu
    - name: ripgrep
    - name: starship
    - name: talisman
    - name: watch
    - name: worktrunk
    - name: xh
    - name: yq
    - name: steipete/tap/remindctl
    - name: typescript-language-server
    - name: pyright
    - name: gopls
    - name: terraform-ls
    - name: lua-language-server
    - name: bash-language-server
    - name: yaml-language-server
    - name: witr

  # aoe (Agent of Empires) plugins — installed/updated via
  # run_onchange_after_plugins-aoe.sh.tmpl. A list from day one (even with a
  # single entry) so adding another aoe plugin later is a one-line registry
  # edit, matching the idiom of every other registry key here.
  aoe_plugins:
    - source: "gh:agent-of-empires/plugin-github"
      id: "agent-of-empires.github"

  pi_packages: []

  casks:
    - name: gcloud-cli
    - name: font-monaspace-nf
    - name: claude-code
    - name: tailscale-app
    - name: obsidian
    - name: figma

  # GitHub releases — installed via .chezmoiexternal.toml.tmpl
  github_releases:
    - name: opencode
      repo: anomalyco/opencode
      target: .local/bin/opencode
      asset: opencode-darwin-arm64.zip
      type: archive-file
      path: opencode
      executable: true
      refresh_period: 24h

    # Note: com.apple.provenance on Apple Silicon prevents chezmoi's atomic
    # rename from updating files inside this bundle. On version updates, run:
    #   rm -rf ~/Applications/NayaFlow-Beta.app && chezmoi apply
    - name: naya-flow-beta
      repo: NayaTech/NayaFlow-beta-releases
      target: Applications
      app: NayaFlow-Beta.app
      asset: NayaFlow-Beta-*-arm64-mac.zip
      type: archive
      refresh_period: 24h

    - name: ical
      repo: BRO3886/ical
      target: .local/bin/ical
      asset: ical-darwin-arm64.tar.gz
      type: archive-file
      path: ical
      executable: true
      refresh_period: 24h

  # Non-authored skills synced into the global skill dir. Two entry shapes:
  #   - remote: { repo, skill }   → fetched via `gh skill install`
  #   - local:  { source, match } → mirrored from a project dir (skills a CLI
  #     like openspec generates project-locally; `match` globs the dir names)
  skills:
    - repo: BRO3886/ical
      skill: ical-cli
    - repo: athal7/opencode-permission-audit
      skill: permission-audit
    - repo: addyosmani/agent-skills
      skill: incremental-implementation
    - repo: addyosmani/agent-skills
      skill: test-driven-development
    - repo: addyosmani/agent-skills
      skill: browser-testing-with-devtools
    - repo: addyosmani/agent-skills
      skill: source-driven-development
    - source: .opencode/skills
      match: openspec-*

  # npm-managed global packages
  npm:
    homebridge_version: "1.11.4"
    ui_version: "5.21.0"
    nest_sdm_version: "1.1.23"
    ffmpeg_for_homebridge_version: "2.2.2"

  # mise-managed runtimes and tools
  mise:
    - name: ruby
      version: "3.4"
    - name: node
      version: lts
    - name: bun
      version: latest
    - name: python
      version: "3"
    - name: rust
      version: stable
    - name: ruff
      version: latest
    - name: uv
      version: latest
    - name: pre-commit
      version: latest
    - name: terraform
      version: latest
    - name: helm
      version: latest
    - name: argocd
      version: latest
    # Token-efficiency opencode plugin (also wired in agentcfg.yaml.tmpl's
    # harnesses.opencode.extra.plugin array; declared here for the repo's
    # package-registry convention).
    - name: npm:@tarquinen/opencode-dcp
      version: "3.1.12"
    # Coding agent needed for `omp`/`pi` to render in aoe's structured
    # view natively (every workflow.yaml.tmpl step without an explicit
    # targets: applies to omp too — see dot_config/agentcfg/).
    - name: npm:@oh-my-pi/pi-coding-agent
      version: latest
    - name: npm:@google/jules
      version: latest
    - name: pipx:pytest
      version: latest
    - name: pipx:check-jsonschema
      version: latest
    - name: pipx:grip
      version: latest
    - name: pipx:skills-ref
      version: latest
    - name: pipx:mlx-lm
      version: latest
