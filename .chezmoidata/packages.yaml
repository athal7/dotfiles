# Package registry — single source of truth for managed dependencies.
# Homebrew, mise, GitHub releases, and pinned source files.
# Install scripts and chezmoi externals are generated from this file.

packages:
  taps:
    - athal7/tap
    - github/gh
    - jnsahaj/lumen
    - steipete/tap
    - can1357/tap
    - kunobi-ninja/kunobi

  brews:
    - name: can1357/tap/omp
    - name: aoe
    - name: autojump
    - name: bat
    - name: chezmoi
    - name: colima
    - name: container
    - name: direnv
    - name: docker
    - name: docker-compose
    - name: ffmpeg
    - name: fzf
    - name: git
    - name: gh
    - name: athal7/tap/attention
    - name: athal7/tap/cal-automation
    - name: athal7/tap/git-worktree-sync
    - name: athal7/tap/launchd-yaml
    - name: athal7/tap/kb
    - name: git-spice
    - name: jc
    - name: jq
    - name: k9s
    - name: kunobi-ninja/kunobi/kache
    - name: kubernetes-cli
    - name: jnsahaj/lumen/lumen
    - name: macos-trash
    - name: mas
    - name: mise
    - name: neovim
    - name: openssl
    - name: opentofu
    - name: ripgrep
    - name: starship
    - name: talisman
    - name: watch
    - name: worktrunk
    - name: xh
    - name: yq
    - name: steipete/tap/remindctl
    - name: typescript-language-server
    - name: pyright
    - name: gopls
    - name: tofu-ls
    - name: lua-language-server
    - name: bash-language-server
    - name: yaml-language-server
    - name: witr

  # OMP plugins installed by run_onchange_after_plugins-omp.sh.tmpl.
  omp_plugins:
    - "@mozilla-ai/pi-otari"

  # aoe (Agent of Empires) plugins — installed/updated via
  # run_onchange_after_plugins-aoe.sh.tmpl. Keep sources and IDs here;
  # managed enablement/settings live in config.toml.tmpl; grants stay local.
  aoe_plugins:
    # Reserved-namespace plugin: aoe refuses an @ref install here (unverified
    # code cannot claim agent-of-empires.*), so this tracks the latest release.
    # v2.4.0 ships the one-character row-badge marks (dense_row_badge_glyphs).
    - source: "gh:agent-of-empires/plugin-github"
      id: "agent-of-empires.github"
    - source: "gh:agent-of-empires/plugin-kanban"
      id: "agent-of-empires.kanban"
    # No published releases upstream, so update cannot resolve a bare slug (it
    # falls back to the default branch only on first install). Track the branch
    # explicitly so `aoe plugin update` keeps working.
    - source: "gh:agent-of-empires/plugin-linear@main"
      id: "community.linear"
    # Same no-release situation as Linear: track the branch so updates resolve.
    # The upstream manifest ships api_version 19 with the freebuff agent
    # integration, which the host only reads from aoe-plugin.toml.
    # `dev.example.aoe-freebuf` is upstream's own id, not a local placeholder:
    # aoe reserves `agent-of-empires.*` for featured plugins, so a community
    # plugin cannot claim the org namespace.
    - source: "gh:agent-of-empires/plugin-freebuf@main"
      id: "dev.example.aoe-freebuf"
    # Paired OMP integration: its manifest gates which OMP releases may reply
    # through AoE, so a stale copy silently disables the approval dialog.
    # Track the branch (no releases upstream) and pair it with the extension
    # pinned in github_files below.
    - source: "gh:agent-of-empires/plugin-omp@main"
      id: "omp.agent-of-empires"

  casks:
    - name: firefox
    - name: ghostty
    - name: gcloud-cli
    - name: font-monaspace-nf
    - name: tailscale-app
    - name: obsidian
    - name: figma

  # GitHub releases — installed via .chezmoiexternal.toml.tmpl
  github_releases:
    - name: openflow
      repo: create-collective/openflow
      target: Applications/OpenFlow-0.7.1.dmg
      tag: openflow-v0.7.1
      asset: OpenFlow-0.7.1-mac-arm64.dmg
      checksum: 2e14c83dc195f4271ebb19f367d23fb3f2de74007f612dbc7a3595b873b5dfd6
      type: file

    - name: create-companion
      repo: create-collective/create-companion
      target: Applications
      app: Create Companion.app
      tag: v1.0.0
      asset: Create.Companion_1.0.0_universal.app.tar.gz
      checksum: 1bab285db7605bdcdffe71b6371b1ef1a87c7cee53d5ae2d94fdf17ea109b41b
      type: archive

    - name: ical
      repo: BRO3886/ical
      target: .local/bin/ical
      asset: ical-darwin-arm64.tar.gz
      type: archive-file
      path: ical
      executable: true
      refresh_period: 24h
  # GitHub source files are installed through .chezmoiexternal.toml.tmpl.
  github_files:
    - name: aoe-omp-extension
      repo: agent-of-empires/plugin-omp
      # No releases or tags upstream, so track the branch the paired AoE plugin
      # installs from. No checksum: it would fail the apply on every upstream
      # commit, so integrity now rests on the repo rather than a pinned digest.
      ref: main
      path: omp-extension/index.ts
      target: .local/share/omp/extensions/agent-of-empires.ts



  # Non-authored skills synced into the global skill dir.
  skills:
    - repo: BRO3886/ical
      skill: ical-cli

  # npm-managed global packages — unpinned, so each install takes the current
  # published release.
  npm:
    homebridge_version: "latest"
    ui_version: "latest"
    nest_sdm_version: "latest"
    ffmpeg_for_homebridge_version: "latest"

  # mise-managed runtimes and tools
  mise:
    - name: ruby
      version: "3.4"
      # ruby-lsp must exist under whichever Ruby a project selects via
      # .ruby-version, so install it into every Ruby rather than once with gem:.
      postinstall: "gem install ruby-lsp --version 0.26.9"
    - name: node
      version: lts
    - name: bun
      version: latest
    - name: python
      version: "3"
    - name: rust
      version: stable
    - name: ruff
      version: latest
    - name: uv
      version: latest
    - name: pre-commit
      version: latest
    - name: helm
      version: latest
    - name: argocd
      version: latest
    - name: spacectl
      version: latest
    - name: fnox
      version: latest
    - name: npm:freebuff
      version: latest
    - name: npm:codebase-memory-mcp
      version: latest
      allow_builds: [codebase-memory-mcp]
    - name: npm:@mozilla/firefox-devtools-mcp
      version: latest
    - name: pipx:pytest
      version: latest
    - name: pipx:check-jsonschema
      version: latest
    - name: pipx:grip
      version: latest
    - name: pipx:skills-ref
      version: latest
