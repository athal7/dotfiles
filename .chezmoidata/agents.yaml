# Per-org model-class overrides only (dot_local/bin/executable_aoe-model-class
# reads `.model_class`/`.agents` from `chezmoi data` at aoe launch time to
# materialize gitignored, project-local .opencode/opencode.json and
# .omp/config.yml — see that script's own header for why this can't be a
# rendered lookup file). Agent definitions, prompts, permissions, and MCP
# grants live in dot_config/agentcfg/workflow.yaml.tmpl now; this file's
# `name`/`class` pairs must stay in sync with those steps' own `name`/
# `class` fields (only entries with a `class` are used — a proxy agent
# with no class, e.g. zoom/slack/atlassian/github/google/linear, is
# skipped here, matching how the real workflow steps have none either).
model_class:
  default: anthropic/claude-sonnet-5
  smol: mlx/default_model
  slow: anthropic/claude-opus-5
  plan: anthropic/claude-opus-5
agents:
  - name: lead
    class: default
  - name: planner
    class: slow
  - name: qa
    class: default
  - name: build
    class: default
  - name: scout
    class: default
  - name: general
    class: default
