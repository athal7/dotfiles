# Single source of truth for the locally-hosted mlx model. Consumed by:
#   - dot_config/launchd-yaml/agents.yaml.tmpl   (mlx-server ProgramArguments)
#   - dot_omp/private_agent/models.yml.tmpl      (omp mlx provider)
#   - dot_config/agentcfg/agentcfg.yaml.tmpl     (harnesses.opencode.extra mlx provider)
# NOTE: unrelated to run_once_after_mlx-gpu-wired-limit.sh's
# iogpu.wired_limit_mb=40960 — that is GPU wired MB, not a context window.
local_model:
  provider: mlx
  host: 127.0.0.1
  port: 8091
  hf_repo: mlx-community/Qwen3.6-35B-A3B-OptiQ-4bit
  api: openai-completions
  api_key: mlx-local
  id: default_model
  name: qwen3.6-35b-a3b-optiq
  context_window: 32000
  max_tokens: 8192
  # KV-cache bound for mlx_lm.server (mlx-lm#883/#1666 mitigation): with the
  # wired-limit shim disabled, unbounded KV cache growth spills into swap
  # instead of panicking, which is safer but still starves the whole box.
  # 3GiB budget across at most 4 distinct cached conversations keeps total
  # process memory (weights ~20-21GB + cache + prefill activations)
  # comfortably under the 48GB physical ceiling even with ~20 concurrent
  # aoe sessions. Reduced from 10GiB/128k-ctx after a 39.77GB active-memory
  # peak (34.8GB swap used) traced to: 21GB weights + up to 10GB prompt
  # cache + ~13GB transient prefill-activation spike on long (60k+ token)
  # prompts. context_window dropped 128000->32000 to shrink both the KV
  # cache (this architecture is hybrid linear-attention: only 10/40 layers
  # carry a growing KV cache, so KV itself was never the driver — it's the
  # prefill activations that scale with prompt length) and force earlier
  # compaction upstream so prompts stop reaching 60k+ tokens.
  prompt_cache_size: 4
  prompt_cache_bytes: 3221225472
  # Halves the per-forward-pass token batch during prompt processing to
  # shrink the transient activation spike that was the largest unaccounted
  # term in the 39.77GB peak (measured ~26.5GB steady-state active memory
  # vs. the peak). Default is 2048; trades some prefill throughput for a
  # lower memory ceiling.
  prefill_step_size: 512
