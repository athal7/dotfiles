      {
        "name": "github",
        "transport": "remote",
        "url": "https://api.githubcopilot.com/mcp/",
        "headers": {
          # OMP executes a leading "!" value as a shell command, so the server
          # resolves its own credential from gh's keyring instead of relying on
          # GITHUB_TOKEN being forwarded into every agent process. The explicit
          # unset keeps an inherited token from winning over the keyring.
          "Authorization": { "value": "!printf 'Bearer %s' \"$(env -u GITHUB_TOKEN -u GH_TOKEN gh auth token)\"" },
          "X-MCP-Toolsets": { "value": "context,issues,pull_requests,repos,users,actions" },
        },
        "tools": [
          "actions_get", "actions_list", "get_job_logs",
          "list_issues", "list_notifications", "get_notification_details",
          "pull_request_read", "get_commit", "list_commits", "list_branches",
          "get_file_contents", "search_code", "search_repositories", "search_commits",
          "add_issue_comment", "add_comment_to_pending_review", "add_pull_request_review_comment",
          "create_pull_request_review", "submit_pending_pull_request_review",
          "delete_pending_pull_request_review", "request_pull_request_reviewers",
          "resolve_review_thread", "unresolve_review_thread", "actions_run_trigger",
          "add_reply_to_pull_request_comment", "create_branch", "create_or_update_file",
          "create_pull_request", "create_repository", "delete_file", "fork_repository",
          "issue_write", "merge_pull_request", "pull_request_review_write", "push_files",
          "sub_issue_write", "update_issue_comment", "update_pull_request",
          "update_pull_request_branch"
        ],
        "approval_allow": [
          "create_pull_request", "create_branch", "create_or_update_file", "delete_file",
          "fork_repository", "push_files", "create_repository",
          # Draft-scoped review work: adding inline comments to an existing
          # pending review and deleting that draft cannot publish anything.
          "add_comment_to_pending_review", "delete_pending_pull_request_review",
          # Maintenance on an already-open PR: reviewer requests, thread
          # resolution, and branch updates.
          "resolve_review_thread", "unresolve_review_thread",
          "request_pull_request_reviewers", "update_pull_request",
          "update_pull_request_branch"
          # pull_request_review_write is deliberately absent: it also publishes
          # (create with an event, submit_pending), which reaches reviewers.
          # update_pull_request is allowed as a whole, so marking ready or
          # closing a PR is unattended along with the reviewer re-request.
        ],
        "approval_prompt_globs": [
          "mcp__github_*_write", "mcp__github_*_trigger", "mcp__github_add_*",
          "mcp__github_create_pull_request_review", "mcp__github_merge_*",
          "mcp__github_request_*", "mcp__github_submit_*", "mcp__github_update_*"
        ],
      },
