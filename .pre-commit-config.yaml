repos:
  # Standard hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
        exclude: (^|/)modify_[^/]*\.json$
      - id: check-toml
        exclude: (^|/)modify_[^/]*\.toml$
      - id: check-yaml
        exclude: ^dot_omp/private_agent/modify_private_config\.yml$
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files


  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        # Exclude zsh scripts (shellcheck doesn't support zsh), direnvrc, and
        # .tmpl files (raw Go-template control-flow syntax isn't valid bash
        # pre-render; the chezmoi-templates hook below shellchecks the
        # rendered output instead).
        exclude: (direnvrc|reload-shell\.sh|\.tmpl)$
        args: [--shell=bash]

  # Chezmoi template validation
  - repo: local
    hooks:
      - id: chezmoi-templates
        name: validate chezmoi templates
        # Renders each .tmpl, then — since Go-template control-flow syntax
        # embedded in a shell script isn't valid bash/sh/zsh pre-render, and
        # the raw shellcheck hook above therefore excludes .tmpl files
        # entirely — shellchecks the *rendered* output when it starts with a
        # sh/bash/zsh shebang, so template-driven scripts still get linted.
        # Renders with local.yaml.example layered on top via
        # --override-data-file: `.chezmoidata/local.yaml` is gitignored, so
        # git worktrees never receive it, and templates reading `.runlayer`,
        # `.secrets`, or `.orgs` would otherwise fail this hook in every
        # worktree but the primary checkout. The example file already ships
        # placeholder values for every key those templates need.
        # --override-data-file needs a real .yaml extension to autodetect
        # format, hence the temp copy. Uses a PID-scoped path with `cp`
        # (never `mktemp`): pre-commit launches this hook as several
        # parallel processes for --all-files, and uutils coreutils'
        # `mktemp` seeds its random suffix by wall-clock second, so
        # concurrent invocations in the same second collide on the same
        # "random" name and fail with EEXIST.
        entry: bash -c 'src="$(git rev-parse --show-toplevel)"; overlay="${TMPDIR:-/tmp}/chezmoi-templates-local-example-$$.yaml"; trap "rm -f \"$overlay\"" EXIT; cp "$src/local.yaml.example" "$overlay"; status=0; for f in "$@"; do rendered=$(chezmoi execute-template -S "$src" --override-data-file "$overlay" < "$f") || { status=1; continue; }; if head -1 <<<"$rendered" | grep -qE "^#!.*\b(ba|z)?sh\b"; then shellcheck --shell=bash --severity=error <(printf "%s\n" "$rendered") || status=1; fi; done; exit $status' --
        language: system
        files: (\.tmpl$|^dot_omp/private_agent/modify_private_config\.yml$)
        exclude: ^\.chezmoi\.toml\.tmpl$

  # Agent Skills validation
  - repo: local
    hooks:
      - id: validate-skills
        name: validate skill frontmatter
        entry: scripts/validate-skills.sh
        language: script
        files: dot_agents/skills/.*/SKILL\.md$

  # Talisman (secrets scanning) - already configured, keep it
  - repo: https://github.com/thoughtworks/talisman
    rev: v1.32.0
    hooks:
      - id: talisman-commit
