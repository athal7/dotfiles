repos:
  # Standard hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
        exclude: (^|/)modify_[^/]*\.json$
      - id: check-toml
        exclude: (^|/)modify_[^/]*\.toml$
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files


  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        # Exclude zsh scripts (shellcheck doesn't support zsh), direnvrc, and
        # .tmpl files (raw Go-template control-flow syntax isn't valid bash
        # pre-render; the chezmoi-templates hook below shellchecks the
        # rendered output instead).
        exclude: (direnvrc|reload-shell\.sh|\.tmpl)$
        args: [--shell=bash]

  # Chezmoi template validation
  - repo: local
    hooks:
      - id: chezmoi-templates
        name: validate chezmoi templates
        # Renders each .tmpl against local.yaml.example and shellchecks the
        # rendered output when it starts with a shell shebang. The mechanics —
        # private data overlay, why .tmpl files are excluded from the hook
        # above, and the PID-scoped temp path — live in the script.
        entry: scripts/check-chezmoi-templates.sh
        language: script
        files: \.tmpl$
        exclude: ^\.chezmoi\.toml\.tmpl$

  # Agent Skills validation
  - repo: local
    hooks:
      - id: validate-skills
        name: validate skill frontmatter
        entry: scripts/validate-skills.sh
        language: script
        files: dot_agents/skills/.*/SKILL\.md$

  # Talisman (secrets scanning) - already configured, keep it
  - repo: https://github.com/thoughtworks/talisman
    rev: v1.32.0
    hooks:
      - id: talisman-commit
