# Firefox MCP moved to @mozilla/firefox-mcp in 0.11.0 and still publishes that
# release under the old name. aube's minimumPackageAge gate rejects any new
# package name for 30 days regardless of version, so allowlist this one rather
# than keeping mise on the superseded name. Reviewed 2026-11-25: both names
# resolve 0.11.0 published the same day (distinct tarballs, so this rests on the
# upstream rename announcement, not on byte identity). Remove after 2026-12-18,
# when the name clears the default gate on its own.
allowed-unpopular-packages = ["@mozilla/firefox-mcp"]
