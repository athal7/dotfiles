# Mirrors .chezmoidata/mcp.yaml's server list for the servers agentcfg
# renders (opencode's mcp/tools blocks; omp rendering isn't wired live yet
# — see the integration summary). `tools:` allowlists aren't set here:
# neither renderer actually consumes MCPServer.Tools for restriction today
# (opencode's per-agent grants are namespace globs, not per-tool), so there
# is nothing to gain by enumerating them, unlike .chezmoidata/mcp.yaml
# (still hand-authored, still needed by omp's run_onchange generators for
# per-subagent frontmatter tool IDs and the global tools.approval map).
#
# Seven `runlayer-*` servers proxy OAuth'd services (Zoom/Slack/Atlassian/
# Google/…) at a workspace-specific URL. The old chezmoi templates read
# that URL from `.chezmoidata/local.yaml`'s gitignored `runlayer:` map —
# private, machine-specific data that must never be committed here.
# agentcfg's `Value` type gives a public-safe equivalent: resolve each
# URL from an environment variable at apply time instead. Set these in a
# private, untracked file (e.g. ~/.config/zsh/private.zsh, per this repo's
# own AGENTS.md convention for infra details) on each machine that uses
# them; an unset variable resolves to an empty string rather than erroring
# (see agentcfg's docs/schema.md Value.Resolve semantics).
mcp_servers:
  - name: context7
    transport: remote
    url: https://mcp.context7.com/mcp

  - name: firefox-devtools
    transport: local
    command:
      - npx
      - "@mozilla/firefox-devtools-mcp@0.9.7"
      - --firefox-path
      - /Applications/Firefox.app/Contents/MacOS/firefox
      - --enable-script

  - name: github
    transport: remote
    url: https://api.githubcopilot.com/mcp/
    headers:
      Authorization:
        from: command
        run: [gh, auth, token]
        format: "Bearer {}"

  - name: linear
    transport: remote
    url: https://mcp.linear.app/mcp

  - name: figma-desktop
    transport: remote
    url: http://127.0.0.1:3845/mcp

  - name: runlayer-zoom
    transport: remote
    url:
      from: env
      name: RUNLAYER_ZOOM_MCP_URL

  - name: runlayer-self
    transport: remote
    url:
      from: env
      name: RUNLAYER_SELF_MCP_URL

  - name: runlayer-slack
    transport: remote
    url:
      from: env
      name: RUNLAYER_SLACK_MCP_URL

  - name: runlayer-atlassian
    transport: remote
    url:
      from: env
      name: RUNLAYER_ATLASSIAN_MCP_URL

  - name: runlayer-gmail
    transport: remote
    url:
      from: env
      name: RUNLAYER_GMAIL_MCP_URL

  - name: runlayer-gcalendar
    transport: remote
    url:
      from: env
      name: RUNLAYER_GCALENDAR_MCP_URL

  - name: runlayer-gdrive
    transport: remote
    url:
      from: env
      name: RUNLAYER_GDRIVE_MCP_URL

  - name: runlayer-gdocs
    transport: remote
    url:
      from: env
      name: RUNLAYER_GDOCS_MCP_URL

  - name: runlayer-gsheets
    transport: remote
    url:
      from: env
      name: RUNLAYER_GSHEETS_MCP_URL
