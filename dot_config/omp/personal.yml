# Per-process overlay for personal repositories.
modelRoles:
  advisor: openrouter/cohere/north-mini-code:free
  commit: "@smol"
  default: openrouter/cohere/north-mini-code:free
  memory: "@smol"
  plan: openrouter/cohere/north-mini-code:free
  slow: openrouter/nvidia/nemotron-3.5-lightning:free
  smol: openrouter/cohere/north-mini-code:free
  task: openrouter/cohere/north-mini-code:free
  tiny: "@smol"
  vision: openrouter/nvidia/nemotron-3.5-super-vl:free
  widget: "@smol"
  web: web/duckduckgo
  speech: local/kokoro
  dictation: local/parakeet-tdt-0.6b-v3
  judge: "@smol"
enabledModels:
  - openrouter/cohere/north-mini-code:free
  - openrouter/nvidia/nemotron-3.5-lightning:free
  - openrouter/nvidia/nemotron-3.5-super-vl:free
generate_image:
  enabled: false
retry:
  modelFallback: true
  maxRetries: 2
  rateLimitWalksChain: true
  fallbackChains:
    default: &personal_fallback
      - openrouter/nvidia/nemotron-3.5-lightning:free
      - openrouter/cohere/north-mini-code:free
    smol: *personal_fallback
    slow: *personal_fallback
    plan: *personal_fallback
    task: *personal_fallback
    advisor: *personal_fallback
    commit: *personal_fallback
    tiny: *personal_fallback
    memory: *personal_fallback
    widget: *personal_fallback
    vision:
      - openrouter/nvidia/nemotron-3.5-super-vl:free
    judge: []
    image: []
    web: []
    speech: []
    dictation: []
