{{- /* chezmoi:modify-template */ -}}
{{- $defaults := fromYaml (includeTemplate "omp-agent-defaults.yml.tmpl" .) -}}
{{- $live := dict -}}
{{- if and (hasKey .chezmoi "stdin") .chezmoi.stdin -}}
{{- $live = fromYaml .chezmoi.stdin -}}
{{- end -}}
{{- $config := mergeOverwrite (deepCopy $defaults) $live -}}
{{- if hasKey $config "mnemopi" -}}
{{- $_ := unset $config "mnemopi" -}}
{{- end -}}
{{- if hasKey $config "providers" -}}
{{- $_ := unset (index $config "providers") "webSearchOrder" -}}
{{- $_ := unset (index $config "providers") "memoryModel" -}}
{{- if eq (len (index $config "providers")) 0 -}}
{{- $_ := unset $config "providers" -}}
{{- end -}}
{{- end -}}
{{- $_ := setValueAtPath "bash" (index $defaults "bash") $config -}}
{{- $_ := setValueAtPath "modelRoles" (index $defaults "modelRoles") $config -}}
{{- $_ := setValueAtPath "modelRoleStorage" (index $defaults "modelRoleStorage") $config -}}
{{- $_ := setValueAtPath "prewalk.enabled" (index (index $defaults "prewalk") "enabled") $config -}}
{{- if hasKey (index $config "prewalk") "into" -}}
{{- $_ := unset (index $config "prewalk") "into" -}}
{{- end -}}
{{- range $providerKey := list "tinyModel" "autoThinkingModel" -}}
{{- $_ := setValueAtPath (printf "providers.%s" $providerKey) (index (index $defaults "providers") $providerKey) $config -}}
{{- end -}}
{{- $_ := setValueAtPath "computer" (index $defaults "computer") $config -}}
{{- $_ := setValueAtPath "autolearn" (index $defaults "autolearn") $config -}}
{{- $_ := setValueAtPath "memory" (index $defaults "memory") $config -}}
{{- $_ := setValueAtPath "autoResume" (index $defaults "autoResume") $config -}}
{{- $_ := setValueAtPath "compaction.strategy" (index (index $defaults "compaction") "strategy") $config -}}
{{- if hasKey $config "compaction" -}}
{{- $_ := unset (index $config "compaction") "methodOrder" -}}
{{- end -}}
{{- if hasKey $config "retry" -}}
{{- $_ := unset (index $config "retry") "fallbackChains" -}}
{{- end -}}
{{- $_ := setValueAtPath "task.prewalk" (index (index $defaults "task") "prewalk") $config -}}
{{- $_ := setValueAtPath "task.agentModelOverrides" (index (index $defaults "task") "agentModelOverrides") $config -}}
{{- $_ := setValueAtPath "task.disabledAgents" (index (index $defaults "task") "disabledAgents") $config -}}
{{- $_ := setValueAtPath "advisor.enabled" (index (index $defaults "advisor") "enabled") $config -}}
{{- $_ := setValueAtPath "advisor.model" (index (index $defaults "advisor") "model") $config -}}
{{- $_ := setValueAtPath "advisor.subagents" (index (index $defaults "advisor") "subagents") $config -}}
{{- $_ := setValueAtPath "tools.approval" (index (index $defaults "tools") "approval") $config -}}
{{- $_ := setValueAtPath "tools.approvalMode" (index (index $defaults "tools") "approvalMode") $config -}}
{{- $_ := setValueAtPath "tools.xdev" (index (index $defaults "tools") "xdev") $config -}}
{{- $config | toYaml -}}
