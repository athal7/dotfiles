# Create Companion configuration
# Generated by tools/gen_presets.py -- edit freely; the engine reloads on save.
#
# transport:  which F-key the Tune/Touch firmware emits for each gesture.
#             Only keys listed here are intercepted; all other keys pass through.
# profiles:   per-application bindings, matched on the foreground executable
#             (Windows) or bundle id (macOS), optionally narrowed by a
#             window_title substring (websites). Unbound events fall back to
#             default_profile. enabled = false keeps a profile but never matches it.
# accel:      none | light | medium | aggressive -- repeat count grows with dial speed;
#             multiplier = N gives N actions per detent before the curve (default 1).
#             [engine.accel] tunes the curves: [[interval_ms, repeat], ...] and max_repeat.

schema_version = 2

[engine]
start_at_login = false
log_level = "info"
# A modifier (Shift/Ctrl/Alt/Win) is part of a module's key only if it went down
# within this many ms before the F-key. Held longer = you are holding it; ignored.
namespace_window_ms = 100
# Some gestures arrive as a run of keys scaled to the finger travel (Tune: 2-finger swipes;
# Touch: 2-finger scroll in any direction, 4-finger swipe up/down). Unless an
# input or binding says "follow", keys within this many ms of the previous one are the same swipe
# and only the first acts.
stream_gap_ms = 300

[engine.accel]
# Turning faster than interval_ms between detents gives that many actions per detent.
light = [[150, 2], [80, 3]]
medium = [[250, 2], [150, 4], [80, 8]]
aggressive = [[250, 3], [150, 6], [80, 12]]
max_repeat = 32

[transport]
# macOS never delivers F21-F24, so the Tune is flashed to F13-F20 here.
TUNE_CW = { key = "F20" }
TUNE_CCW = { key = "F19" }
TUNE_TAP_1F = { key = "F18" }
TUNE_SWIPE_LEFT = { key = "F17" }
TUNE_SWIPE_RIGHT = { key = "F16" }
TUNE_SWIPE_UP = { key = "F15" }
TUNE_SWIPE_DOWN = { key = "F14" }
LEFT_TOUCH_TAP_3F = { key = "F17", mods = "shift" }
LEFT_TOUCH_SWIPE_LEFT_3F = { key = "F13", mods = "shift" }
LEFT_TOUCH_SWIPE_RIGHT_3F = { key = "F14", mods = "shift" }
LEFT_TOUCH_SWIPE_UP_3F = { key = "F15", mods = "shift" }
LEFT_TOUCH_SWIPE_DOWN_3F = { key = "F16", mods = "shift" }
LEFT_TOUCH_TAP_4F = { key = "F20", mods = "shift" }
LEFT_TOUCH_SWIPE_LEFT_4F = { key = "F18", mods = "shift" }
LEFT_TOUCH_SWIPE_RIGHT_4F = { key = "F19", mods = "shift" }
LEFT_TOUCH_SWIPE_UP_4F = { key = "F13", mods = "ctrl" }
LEFT_TOUCH_SWIPE_DOWN_4F = { key = "F14", mods = "ctrl" }
# Touch modules use a modifier namespace on the same keys, e.g.:
# LEFT_TOUCH_SWIPE_LEFT = { key = "F17", mods = "shift" }

[default_profile]
name = "System"

[default_profile.bindings.TUNE_CW]
name = "Volume up"
action = { type = "media", key = "volume_up" }
accel = "light"

[default_profile.bindings.TUNE_CCW]
name = "Volume down"
action = { type = "media", key = "volume_down" }
accel = "light"

[default_profile.bindings.TUNE_TAP_1F]
name = "Mute"
action = { type = "media", key = "mute" }

[default_profile.bindings.TUNE_SWIPE_LEFT]
name = "Previous track"
action = { type = "media", key = "previous_track" }

[default_profile.bindings.TUNE_SWIPE_RIGHT]
name = "Next track"
action = { type = "media", key = "next_track" }

[default_profile.bindings.TUNE_SWIPE_UP]
name = "Play / pause"
action = { type = "media", key = "play_pause" }

[default_profile.bindings.TUNE_SWIPE_DOWN]
name = "Task view"
action = { type = "keys", chord = "Ctrl+Up" }

# God Mode: bindings here override any and every other profile, whatever is in
# the foreground. Only bind gestures you do not plan to use for anything else.
[god_mode]
name = "God Mode"
