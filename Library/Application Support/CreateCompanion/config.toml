schema_version = 2
profiles = []

[engine]
start_at_login = false
log_level = "info"
namespace_window_ms = 100
stream_gap_ms = 300
check_for_updates = true

[engine.accel]
light = [
    [
    150,
    2,
],
    [
    80,
    3,
],
]
medium = [
    [
    250,
    2,
],
    [
    150,
    4,
],
    [
    80,
    8,
],
]
aggressive = [
    [
    250,
    3,
],
    [
    150,
    6,
],
    [
    80,
    12,
],
]
max_repeat = 32

[transport.TUNE_CW]
key = "F20"
mods = "none"

[transport.TUNE_CCW]
key = "F19"
mods = "none"

[transport.TUNE_TAP_1F]
key = "F18"
mods = "none"

[transport.TUNE_SWIPE_LEFT]
key = "F17"
mods = "none"

[transport.TUNE_SWIPE_RIGHT]
key = "F16"
mods = "none"

[transport.TUNE_SWIPE_UP]
key = "F15"
mods = "none"

[transport.TUNE_SWIPE_DOWN]
key = "F14"
mods = "none"

[transport.LEFT_TOUCH_TAP_3F]
key = "F17"
mods = "shift"

[transport.LEFT_TOUCH_TAP_4F]
key = "F20"
mods = "shift"

[transport.LEFT_TOUCH_SWIPE_LEFT_3F]
key = "F13"
mods = "shift"

[transport.LEFT_TOUCH_SWIPE_LEFT_4F]
key = "F18"
mods = "shift"

[transport.LEFT_TOUCH_SWIPE_RIGHT_3F]
key = "F14"
mods = "shift"

[transport.LEFT_TOUCH_SWIPE_RIGHT_4F]
key = "F19"
mods = "shift"

[transport.LEFT_TOUCH_SWIPE_UP_3F]
key = "F15"
mods = "shift"

[transport.LEFT_TOUCH_SWIPE_UP_4F]
key = "F13"
mods = "ctrl"

[transport.LEFT_TOUCH_SWIPE_DOWN_3F]
key = "F16"
mods = "shift"

[transport.LEFT_TOUCH_SWIPE_DOWN_4F]
key = "F14"
mods = "ctrl"

[default_profile]
name = "System"
enabled = true

[default_profile.match]
windows_exe = []
macos_bundle = []
window_title = []

[default_profile.bindings.TUNE_SWIPE_UP]
accel = "none"
name = "Play / pause"

[default_profile.bindings.TUNE_SWIPE_UP.action]
type = "media"
key = "play_pause"

[default_profile.bindings.TUNE_CW]
accel = "light"
name = "Volume up"

[default_profile.bindings.TUNE_CW.action]
type = "media"
key = "volume_up"

[default_profile.bindings.TUNE_TAP_1F]
accel = "none"
name = "Mute"

[default_profile.bindings.TUNE_TAP_1F.action]
type = "media"
key = "mute"

[default_profile.bindings.TUNE_CCW]
accel = "light"
name = "Volume down"

[default_profile.bindings.TUNE_CCW.action]
type = "media"
key = "volume_down"

[default_profile.bindings.TUNE_SWIPE_LEFT]
accel = "none"
name = "Previous track"

[default_profile.bindings.TUNE_SWIPE_LEFT.action]
type = "media"
key = "previous_track"

[default_profile.bindings.TUNE_SWIPE_DOWN]
accel = "none"
name = "Task view"

[default_profile.bindings.TUNE_SWIPE_DOWN.action]
type = "keys"
chord = "Ctrl+Up"

[default_profile.bindings.TUNE_SWIPE_RIGHT]
accel = "none"
name = "Next track"

[default_profile.bindings.TUNE_SWIPE_RIGHT.action]
type = "media"
key = "next_track"

[god_mode]
name = "God Mode"
enabled = true

[god_mode.match]
windows_exe = []
macos_bundle = []
window_title = []

[god_mode.bindings]
