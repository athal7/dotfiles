set -g extended-keys on

# Nested tmux: aoe attaches to an agent's own tmux session inside the
# dashboard's aoe pane. The outer session always captures the default
# C-b prefix before an inner (nested) tmux client ever sees it, so
# C-b d detaches the *outer* dashboard instead of just the inner agent
# session. F12 forwards a literal C-b d into the focused pane so it
# reaches the inner tmux client instead, detaching only that one layer.
bind-key -n F12 send-keys C-b d

# True color, needed for the hex colors used by the status line below.
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:RGB"

# ---------------------------------------------------------------------------
# Powerline-style status line, palette-matched to nvim's lualine
# (github-nvim-theme "github_dark_default" theme — see
# dot_config/nvim/lua/plugins.lua). Requires a Nerd Font (Monaspace NF is
# installed via .chezmoidata/packages.yaml) for the glyphs below to render.
#
# Gotchas baked into the #() jobs below (each cost real debugging time):
#   - Never use printf's "%s" inside them: tmux applies its own
#     strftime-style "%" substitution over the *entire* status string
#     first, so a literal "%s" gets replaced with a Unix timestamp before
#     the shell ever sees it. Use echo instead of printf.
#   - Escape every literal "$" meant for the shell (variable refs like
#     "$B", not "$(...)" command substitutions) as "\$": tmux's own config
#     parser performs $VARNAME-style environment-variable interpolation on
#     double-quoted option values and silently strips unescaped ones
#     (an unset env var expands to empty) before the shell ever runs.
# ---------------------------------------------------------------------------
set -g @c_bg     "#0d1117"  # canvas.default
set -g @c_panel  "#21262d"  # scale.gray[8], subtle panel background
set -g @c_fg     "#e6edf3"  # fg.default
set -g @c_muted  "#7d8590"  # fg.muted
set -g @c_blue   "#58a6ff"  # blue.base  (lualine "normal" mode accent)
set -g @c_yellow "#d29922"  # yellow.base (window activity)
set -g @c_red    "#ff7b72"  # red.base    (window bell)

set -g status-interval 5
set -g status-style "bg=#{@c_bg},fg=#{@c_fg}"

set -g status-left-length 100
set -g status-left "#[fg=#{@c_bg},bg=#{@c_blue},bold]  #S #[fg=#{@c_blue},bg=#{@c_panel}]#[fg=#{@c_fg},bg=#{@c_panel}]#(B=\$(cd \"#{pane_current_path}\" 2>/dev/null && git branch --show-current 2>/dev/null); [ -n \"\$B\" ] && echo \"  \$B \")#[fg=#{@c_panel},bg=#{@c_bg}]#[fg=#{@c_muted},bg=#{@c_bg}]  #(basename \"#{pane_current_path}\") "

set -g window-status-format " #I:#W "
set -g window-status-style "fg=#{@c_muted},bg=#{@c_bg}"
set -g window-status-current-format "#[fg=#{@c_blue},bg=#{@c_bg}]#[fg=#{@c_bg},bg=#{@c_blue},bold] #I:#W #[fg=#{@c_blue},bg=#{@c_bg},nobold]"
set -g window-status-activity-style "fg=#{@c_yellow},bg=#{@c_bg}"
set -g window-status-bell-style "fg=#{@c_red},bg=#{@c_bg},bold"
set -g window-status-separator ""

set -g status-right-length 60
set -g status-right "#[fg=#{@c_panel},bg=#{@c_bg}]#[fg=#{@c_fg},bg=#{@c_panel}]  #h #[fg=#{@c_blue},bg=#{@c_panel}]#[fg=#{@c_bg},bg=#{@c_blue},bold]  %a %d %b  %H:%M "
